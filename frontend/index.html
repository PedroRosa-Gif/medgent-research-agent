<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MedGent — Clinical Research Agent</title>
    <meta
      name="description"
      content="MedGent is an autonomous clinical-literature research agent. It plans searches, appraises the evidence and writes a cited report. A study tool, not medical advice."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#060912" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f6fc" media="(prefers-color-scheme: light)" />

    <!--
      Apply the saved theme BEFORE first paint (no flash of the wrong theme).
      Mirrors src/lib/theme.ts: key "medgent-theme", values "dark" | "light",
      default dark (the OS preference is intentionally ignored).
    -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('medgent-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        var color = theme === 'light' ? '#f3f6fc' : '#060912';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
